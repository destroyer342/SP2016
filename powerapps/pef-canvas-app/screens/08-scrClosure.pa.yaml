# scrClosure - see DESIGN.md. Chrome (last children) is generated by tools/gen_chrome.py.
Screens:
  scrClosure:
    Properties:
      Fill: =RGBA(243, 245, 248, 1)
      OnVisible: |-
        =Set(gblTotals, With({lab: Sum(colStaff, Cost), opx: Sum(colRunningCosts, Amount), svc: If(gblPEF.ServiceSBURequired, Sum(colServiceSBUs, Cost), 0), com: gblPEF.RevenueStream in ["Cash", "Products and Services"]}, With({base: lab + opx + gblPEF.CarryOverLabour}, With({cont: If(gblPEF.ContingencyByPercent, base * gblPEF.ContingencyPct, gblPEF.ContingencyAmount), warr: If(gblPEF.WarrantyByPercent, base * gblPEF.WarrantyPct, gblPEF.WarrantyAmount)}, With({ctrl: base + cont + warr, svcRev: svc * (1 + gblPEF.ServiceProfit)}, With({cost: ctrl + svc}, With({price: If(com, gblPEF.ClientPriceInput, cost * 1.1)}, {Labour: lab, OPEX: opx, CarryOver: gblPEF.CarryOverLabour, PlannedCosts: base, Contingency: cont, ContingencyPctEff: If(base > 0, cont / base, 0), Warranty: warr, WarrantyPctEff: If(base > 0, warr / base, 0), ControllingCosts: ctrl, ServiceCosts: svc, ServiceRevenue: svcRev, ProjectCost: cost, ClientPrice: price, Profit: price - cost, ProfitPct: If(cost > 0, price / cost - 1, 0), ControllingRevenue: price - svcRev, ControllingProfitPct: If(ctrl > 0, (price - svcRev) / ctrl - 1, 0), ServiceProfitPct: gblPEF.ServiceProfit, IsCommercial: com})))))));
        Set(gblEditMode, If(gblRole = "Applicant (CI)" && gblPEF.Status in ["Draft", "Rejected"], DisplayMode.Edit, DisplayMode.View))
    Children:
      - fgdClsBody:
          Control: FluidGrid@2.3.0
          Properties:
            Height: =Parent.Height - 160
            Width: =Parent.Width
            X: =0
            Y: =160
          Children:
            - dcdClsBody:
                Control: DataCard@1.0.2
                Properties:
                  Height: =1892
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - conClsHeader:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        Height: =56
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =16
                      Children:
                        - lblClsPageTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(16, 42, 67, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =30
                              Size: =18
                              Text: ="Project closure"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 560
                              X: =0
                              Y: =0
                        - lblClsPageSubtitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =11
                              Text: ="Capture the actual figures and explain the variance against the original and final plan."
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 560
                              X: =0
                              Y: =30
                        - btnClsReadOnlyBadge:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(0, 94, 162, 1)
                              DisplayMode: =DisplayMode.View
                              Fill: =RGBA(229, 241, 250, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              HoverFill: =Self.Fill
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =10
                              Text: =If(gblRole <> "Applicant (CI)", "Read only · viewing as " & gblRole, "Read only · this PEF is " & Lower(gblPEF.Status))
                              Tooltip: ="Only the applicant (CI) can edit a PEF, and only while it is Draft or Rejected"
                              Visible: =gblPEF.Close && gblEditMode = DisplayMode.View
                              Width: =360
                              X: =Parent.Width - 536
                              Y: =14
                        - btnClsSampleActuals:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 94, 162, 1)
                              BorderThickness: =1
                              Color: =RGBA(0, 94, 162, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              HoverFill: =RGBA(229, 241, 250, 1)
                              OnSelect: |-
                                =Set(gblActuals, gblSampleActuals);
                                Notify("Sample actuals loaded (demo data).", NotificationType.Information)
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =11
                              Text: ="Fill sample actuals"
                              Tooltip: |-
                                ="Demo only: fill the actuals with realistic sample figures"
                              Visible: =gblPEF.Close && gblEditMode = DisplayMode.Edit
                              Width: =168
                              X: =Parent.Width - 344
                              Y: =12
                        - btnClsReview:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(0, 94, 162, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              HoverFill: =RGBA(0, 76, 132, 1)
                              OnSelect: =Navigate(scrReview, ScreenTransition.Fade)
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =11
                              Text: ="Review closure"
                              Tooltip: ="Check the closure for missing information and submit it for approval"
                              Visible: =gblPEF.Close
                              Width: =160
                              X: =Parent.Width - 160
                              Y: =12
                  - conClsNotStarted:
                      Control: GroupContainer@1.5.0
