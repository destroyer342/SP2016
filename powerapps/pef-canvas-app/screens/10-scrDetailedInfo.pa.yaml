# scrDetailedInfo - see DESIGN.md. Chrome (last children) is generated by tools/gen_chrome.py.
Screens:
  scrDetailedInfo:
    Properties:
      Fill: =RGBA(243, 245, 248, 1)
    Children:
      - lblDbgBodyPlaceholder:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(32, 31, 30, 1)
            Font: =Font.'Segoe UI'
            Height: =32
            Size: =11
            Text: ="Body goes here"
            VerticalAlign: =VerticalAlign.Middle
            Width: =400
            X: =24
            Y: =72
      - conDbgAppBar:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderStyle: =BorderStyle.None
            Fill: =RGBA(16, 42, 67, 1)
            Height: =48
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - btnDbgBrand:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(200, 16, 46, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =28
                  HoverFill: =RGBA(168, 12, 38, 1)
                  OnSelect: =Navigate(scrDashboard, ScreenTransition.Fade)
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  Size: =11
                  Text: ="MINTEK"
                  Tooltip: ="Back to the PEF register"
                  Width: =84
                  X: =16
                  Y: =10
            - lblDbgAppTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =48
                  Size: =13
                  Text: ="Project Establishment Forms"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =320
                  X: =112
                  Y: =0
            - lblDbgViewAs:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =RGBA(190, 204, 219, 1)
                  Font: =Font.'Segoe UI'
                  Height: =48
                  Size: =10
                  Text: ="View as"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =56
                  X: =Parent.Width - 372
                  Y: =0
            - drpDbgRole:
                Control: Classic/DropDown@2.3.1
                Properties:
                  BorderColor: =RGBA(255, 255, 255, 1)
                  ChevronBackground: =RGBA(255, 255, 255, 1)
                  ChevronFill: =RGBA(0, 94, 162, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Default: =gblRole
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  Height: =32
                  HoverFill: =RGBA(229, 241, 250, 1)
                  Items: =colRoles
                  OnChange: |-
                    =Set(gblRole, Self.Selected.Value);
                    Set(gblEditMode, If(gblRole = "Applicant (CI)" && gblPEF.Status in ["Draft", "Rejected"], DisplayMode.Edit, DisplayMode.View))
                  Size: =10
                  Tooltip: |-
                    ="Demo only: switch the simulated user to see each approver's view"
                  Width: =196
                  X: =Parent.Width - 308
                  Y: =8
            - icoDbgSettings:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  Height: =24
                  Icon: =Icon.Settings
                  OnSelect: =Navigate(scrDetailedInfo, ScreenTransition.Fade)
                  Tooltip: ="Detailed information"
                  Visible: =gblRole = "Administrator"
                  Width: =24
                  X: =Parent.Width - 100
                  Y: =12
            - btnDbgAvatar:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: =DisplayMode.View
                  Fill: =RGBA(0, 94, 162, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =Self.Fill
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =10
                  Text: =LookUp(colRolePeople, Role = gblRole, Initials)
                  Tooltip: =LookUp(colRolePeople, Role = gblRole, Person) & ", " & LookUp(colRolePeople, Role = gblRole, Position)
                  Width: =32
                  X: =Parent.Width - 56
                  Y: =8
