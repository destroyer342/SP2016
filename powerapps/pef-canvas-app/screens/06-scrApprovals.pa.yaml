                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 520
                              X: =88
                              Y: =44
                        - recAprProgressTrack:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(229, 231, 235, 1)
                              Height: =6
                              Width: =200
                              X: =88
                              Y: =78
