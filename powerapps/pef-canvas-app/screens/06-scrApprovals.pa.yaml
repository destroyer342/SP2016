                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =9
                              Text: ="Last updated " & Text(gblPEF.Modified, "dd mmm yyyy hh:mm")
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =400
                              X: =Parent.Width - 416
