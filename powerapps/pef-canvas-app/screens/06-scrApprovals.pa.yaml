                            Properties:
                              BorderThickness: =0
                              Color: =Switch(gblPEF.Status, "Approved", RGBA(16, 124, 16, 1), "Pending Approval", RGBA(138, 90, 0, 1), "Rejected", RGBA(196, 30, 58, 1), "Closed", RGBA(0, 94, 162, 1), RGBA(96, 94, 92, 1))
                              DisplayMode: =DisplayMode.View
                              Fill: =Switch(gblPEF.Status, "Approved", RGBA(223, 246, 221, 1), "Pending Approval", RGBA(255, 244, 206, 1), "Rejected", RGBA(253, 231, 233, 1), "Closed", RGBA(229, 241, 250, 1), RGBA(237, 235, 233, 1))
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =48
                              HoverFill: =Self.Fill
                              RadiusBottomLeft: =24
                              RadiusBottomRight: =24
                              RadiusTopLeft: =24
                              RadiusTopRight: =24
                              Size: =11
                              Text: =""
                              Width: =48
                              X: =20
                              Y: =24
                        - icoAprStatus:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Color: =Switch(gblPEF.Status, "Approved", RGBA(16, 124, 16, 1), "Pending Approval", RGBA(138, 90, 0, 1), "Rejected", RGBA(196, 30, 58, 1), "Closed", RGBA(0, 94, 162, 1), RGBA(96, 94, 92, 1))
                              Height: =24
                              Icon: =If(gblPEF.Status in ["Approved", "Closed"], Icon.Check, gblPEF.Status = "Rejected", Icon.Error, gblPEF.Status = "Pending Approval", Icon.Clock, Icon.Information)
