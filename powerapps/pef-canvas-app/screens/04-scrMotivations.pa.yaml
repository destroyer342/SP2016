# scrMotivations - Motivations & attachments (InfoPath view Motivations.xsl), see DESIGN.md. Chrome (last children) is generated by tools/gen_chrome.py.
Screens:
  scrMotivations:
    Properties:
      Fill: =RGBA(243, 245, 248, 1)
      OnVisible: |-
        =Set(gblTotals, With({lab: Sum(colStaff, Cost), opx: Sum(colRunningCosts, Amount), svc: If(gblPEF.ServiceSBURequired, Sum(colServiceSBUs, Cost), 0), com: gblPEF.RevenueStream in ["Cash", "Products and Services"]}, With({base: lab + opx + gblPEF.CarryOverLabour}, With({cont: If(gblPEF.ContingencyByPercent, base * gblPEF.ContingencyPct, gblPEF.ContingencyAmount), warr: If(gblPEF.WarrantyByPercent, base * gblPEF.WarrantyPct, gblPEF.WarrantyAmount)}, With({ctrl: base + cont + warr, svcRev: svc * (1 + gblPEF.ServiceProfit)}, With({cost: ctrl + svc}, With({price: If(com, gblPEF.ClientPriceInput, cost * 1.1)}, {Labour: lab, OPEX: opx, CarryOver: gblPEF.CarryOverLabour, PlannedCosts: base, Contingency: cont, ContingencyPctEff: If(base > 0, cont / base, 0), Warranty: warr, WarrantyPctEff: If(base > 0, warr / base, 0), ControllingCosts: ctrl, ServiceCosts: svc, ServiceRevenue: svcRev, ProjectCost: cost, ClientPrice: price, Profit: price - cost, ProfitPct: If(cost > 0, price / cost - 1, 0), ControllingRevenue: price - svcRev, ControllingProfitPct: If(ctrl > 0, (price - svcRev) / ctrl - 1, 0), ServiceProfitPct: gblPEF.ServiceProfit, IsCommercial: com})))))));
        Set(gblEditMode, If(gblRole = "Applicant (CI)" && gblPEF.Status in ["Draft", "Rejected"], DisplayMode.Edit, DisplayMode.View))
    Children:
      - fgdMotBody:
          Control: FluidGrid@2.3.0
          Properties:
            Height: =Parent.Height - 160
            Width: =Parent.Width
            X: =0
            Y: =160
          Children:
            - dcdMotBody:
                Control: DataCard@1.0.2
                Properties:
                  Height: =1788
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - conMotHeader:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        Height: =56
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =16
                      Children:
                        - lblMotPageTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(16, 42, 67, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Size: =18
                              Text: ="Motivations & attachments"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 380
                              X: =0
                              Y: =0
                        - lblMotPageHint:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              Size: =10
                              Text: ="Each revision carries its own motivation. Only the latest can be edited; earlier ones are kept as history."
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 380
                              X: =0
                              Y: =30
                        - btnMotReadOnlyBadge:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(0, 94, 162, 1)
                              DisplayMode: =DisplayMode.View
                              Fill: =RGBA(229, 241, 250, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              HoverFill: =Self.Fill
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =10
                              Text: =If(gblRole <> "Applicant (CI)", "Read only · viewing as " & gblRole, "Read only · this PEF is " & Lower(gblPEF.Status))
                              Tooltip: ="Only the applicant (CI) can edit a PEF, and only while it is Draft or Rejected"
                              Visible: =gblEditMode = DisplayMode.View
                              Width: =360
                              X: =Parent.Width - 360
                              Y: =14
                  - conMotSecMotivations:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =180 + Max(1, CountRows(colMotivations)) * 120
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =80
                      Children:
                        - lblMotMotivationsTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(16, 42, 67, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =13
                              Text: ="Motivations"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 200
                              X: =16
                              Y: =12
                        - lblMotMotivationsHint:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Segoe UI'
                              Height: =18
                              Size: =9
                              Text: ="Motivation is required (latest revision). Earlier motivations are kept as read-only history."
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 200
                              X: =16
                              Y: =36
                        - recMotMotivationsLine:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(229, 231, 235, 1)
                              Height: =1
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =60
                        - btnMotMotivationCount:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(96, 94, 92, 1)
                              DisplayMode: =DisplayMode.View
                              Fill: =RGBA(237, 235, 233, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              HoverFill: =Self.Fill
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =10
                              Text: =CountRows(colMotivations) & If(CountRows(colMotivations) = 1, " motivation", " motivations")
                              Width: =140
                              X: =Parent.Width - 156
                              Y: =14
                        - conMotMotivationsHeader:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(229, 241, 250, 1)
                              Height: =36
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =72
                            Children:
                              - lblMotHdrRevNo:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(16, 42, 67, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    Size: =10
                                    Text: ="Revision No."
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width * 0.14
                                    X: =0
                                    Y: =0
                              - lblMotHdrRevDate:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(16, 42, 67, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    Size: =10
                                    Text: ="Revision Date"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width * 0.14
                                    X: =Parent.Width * 0.14
                                    Y: =0
                              - lblMotHdrMotivation:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(16, 42, 67, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    Size: =10
                                    Text: ="Motivation *"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width * 0.72
                                    X: =Parent.Width * 0.28
                                    Y: =0
                        - galMotMotivations:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Height: =Max(1, CountRows(colMotivations)) * 120
                              Items: =Sort(colMotivations, RevNo)
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =120
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =108
                            Children:
                              - conMotCellRevNo:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Height: =120
                                    Width: =Parent.TemplateWidth * 0.14
                                    X: =0
                                    Y: =0
                                  Children:
                                    - btnMotRevBadge:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderThickness: =0
                                          Color: =If(ThisItem.RevNo = Max(colMotivations, RevNo), RGBA(0, 94, 162, 1), RGBA(96, 94, 92, 1))
                                          DisplayMode: =DisplayMode.View
                                          Fill: =If(ThisItem.RevNo = Max(colMotivations, RevNo), RGBA(229, 241, 250, 1), RGBA(237, 235, 233, 1))
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          HoverFill: =Self.Fill
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =10
                                          Text: =If(ThisItem.RevNo = 0, "Original", "Revision " & ThisItem.RevNo)
                                          Width: =Min(112, Parent.Width - 16)
                                          X: =8
                                          Y: =12
                                    - lblMotRevState:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =18
                                          Size: =9
                                          Text: =If(ThisItem.RevNo = Max(colMotivations, RevNo), If(gblEditMode = DisplayMode.Edit, "Latest · editable", "Latest"), "History · read only")
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.Width - 16
                                          X: =8
                                          Y: =40
                              - lblMotRevDate:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(32, 31, 30, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =24
                                    PaddingLeft: =8
                                    Size: =11
                                    Text: =Text(ThisItem.RevDate, "dd mmm yyyy")
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.TemplateWidth * 0.14
                                    X: =Parent.TemplateWidth * 0.14
                                    Y: =12
                              - conMotCellMotivation:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Height: =120
                                    Width: =Parent.TemplateWidth * 0.72
                                    X: =Parent.TemplateWidth * 0.28
                                    Y: =0
                                  Children:
                                    - txtMotMotivation:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          BorderColor: =If(gblShowErrors && ThisItem.RevNo = Max(colMotivations, RevNo) && IsBlank(ThisItem.Motivation), RGBA(196, 30, 58, 1), RGBA(200, 205, 214, 1))
                                          BorderThickness: =1
                                          Color: =RGBA(32, 31, 30, 1)
                                          Default: =ThisItem.Motivation
                                          DisplayMode: =If(ThisItem.RevNo = Max(colMotivations, RevNo), gblEditMode, DisplayMode.View)
                                          Fill: =If(ThisItem.RevNo = Max(colMotivations, RevNo) && gblEditMode = DisplayMode.Edit, RGBA(255, 255, 255, 1), RGBA(249, 250, 251, 1))
                                          FocusedBorderColor: =RGBA(0, 94, 162, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =96
                                          HintText: ="Describe in detail what this version of the project aims to achieve."
                                          HoverBorderColor: =RGBA(0, 94, 162, 1)
                                          Mode: =TextMode.MultiLine
                                          OnChange: |-
                                            =Patch(colMotivations, ThisItem, {Motivation: Self.Text})
                                          PaddingLeft: =8
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Size: =11
                                          Width: =Parent.Width - 8
                                          X: =4
                                          Y: =12
                              - recMotMotivationRowLine:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =RGBA(229, 231, 235, 1)
                                    Height: =1
                                    Width: =Parent.TemplateWidth
                                    X: =0
                                    Y: =Parent.TemplateHeight - 1
                        - lblMotMotivationsEmpty:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =If(gblShowErrors, RGBA(196, 30, 58, 1), RGBA(96, 94, 92, 1))
                              Font: =Font.'Segoe UI'
                              Height: =120
                              Size: =10
                              Text: =If(gblShowErrors, "Motivation is required (latest revision). Add the motivation for this project.", "No motivation yet. Add the motivation for this project.")
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: =CountRows(colMotivations) = 0
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =108
                        - conMotMotivationsFooter:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              Height: =48
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =108 + Max(1, CountRows(colMotivations)) * 120 + 8
                            Children:
                              - btnMotAddMotivation:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(0, 94, 162, 1)
                                    BorderThickness: =1
                                    Color: =RGBA(0, 94, 162, 1)
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    HoverFill: =RGBA(229, 241, 250, 1)
                                    OnSelect: |-
                                      =Collect(colMotivations, {RevNo: gblPEF.RevisionNo, RevDate: Today(), Motivation: ""})
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Size: =11
                                    Text: ="+ Add New Motivation"
                                    Tooltip: ="Add the motivation for the current revision"
                                    Visible: =gblEditMode = DisplayMode.Edit && (CountRows(colMotivations) = 0 || Last(Sort(colMotivations, RevNo)).RevNo < gblPEF.RevisionNo)
                                    Width: =196
                                    X: =0
                                    Y: =8
                              - lblMotAddMotivationHint:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    Size: =10
                                    Text: ="One motivation per revision. A new motivation can be added when the PEF moves to its next revision."
                                    VerticalAlign: =VerticalAlign.Middle
                                    Visible: =gblEditMode = DisplayMode.Edit && !(CountRows(colMotivations) = 0 || Last(Sort(colMotivations, RevNo)).RevNo < gblPEF.RevisionNo)
                                    Width: =Parent.Width - 420
                                    X: =0
                                    Y: =8
                              - icoMotMotivationError:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Color: =RGBA(196, 30, 58, 1)
                                    Height: =20
                                    Icon: =Icon.Warning
                                    Visible: =gblShowErrors && IsBlank(Last(Sort(colMotivations, RevNo)).Motivation)
                                    Width: =20
                                    X: =Parent.Width - 300
                                    Y: =14
                              - lblMotMotivationError:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(196, 30, 58, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    Size: =10
                                    Text: ="Motivation is required (latest revision)."
                                    VerticalAlign: =VerticalAlign.Middle
                                    Visible: =gblShowErrors && IsBlank(Last(Sort(colMotivations, RevNo)).Motivation)
                                    Width: =272
                                    X: =Parent.Width - 272
                                    Y: =8
                  - conMotSecAttachments:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =180 + Max(1, CountRows(colAttachments)) * 52
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =conMotSecMotivations.Y + conMotSecMotivations.Height + 16
                      Children:
                        - lblMotAttachmentsTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(16, 42, 67, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =13
                              Text: ="Project attachments"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 200
                              X: =16
                              Y: =12
                        - lblMotAttachmentsHint:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Segoe UI'
                              Height: =18
                              Size: =9
                              Text: ="Attach proposals, quotations, budgets and the signed PIC."
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 200
                              X: =16
                              Y: =36
                        - recMotAttachmentsLine:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(229, 231, 235, 1)
                              Height: =1
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =60
                        - btnMotAttachmentCount:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(96, 94, 92, 1)
                              DisplayMode: =DisplayMode.View
                              Fill: =RGBA(237, 235, 233, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              HoverFill: =Self.Fill
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =10
                              Text: =CountRows(colAttachments) & If(CountRows(colAttachments) = 1, " file", " files")
                              Width: =140
                              X: =Parent.Width - 156
                              Y: =14
                        - conMotAttachmentsHeader:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(229, 241, 250, 1)
                              Height: =36
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =72
                            Children:
                              - lblMotHdrFileNo:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(16, 42, 67, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    Size: =10
                                    Text: ="File No."
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width * 0.08
                                    X: =0
                                    Y: =0
                              - lblMotHdrFileName:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(16, 42, 67, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    Size: =10
                                    Text: ="File name"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width * 0.38
                                    X: =Parent.Width * 0.08
                                    Y: =0
                              - lblMotHdrFileSize:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(16, 42, 67, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    Size: =10
                                    Text: ="Size"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width * 0.1
                                    X: =Parent.Width * 0.46
                                    Y: =0
                              - lblMotHdrUploadedBy:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(16, 42, 67, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    Size: =10
                                    Text: ="Uploaded by"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width * 0.18
                                    X: =Parent.Width * 0.56
                                    Y: =0
                              - lblMotHdrUploaded:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(16, 42, 67, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    Size: =10
                                    Text: ="Uploaded on"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width * 0.2
                                    X: =Parent.Width * 0.74
                                    Y: =0
                        - galMotAttachments:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Height: =Max(1, CountRows(colAttachments)) * 52
                              Items: =Sort(colAttachments, FileNo)
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =52
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =108
                            Children:
                              - lblMotFileNo:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(32, 31, 30, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    Size: =11
                                    Text: =ThisItem.FileNo
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.TemplateWidth * 0.08
                                    X: =0
                                    Y: =8
                              - conMotCellFileName:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Height: =52
                                    Width: =Parent.TemplateWidth * 0.38
                                    X: =Parent.TemplateWidth * 0.08
                                    Y: =0
                                  Children:
                                    - icoMotFileType:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Color: =RGBA(0, 94, 162, 1)
                                          Height: =20
                                          Icon: =If(EndsWith(Lower(ThisItem.FileName), ".pdf"), Icon.DocumentPDF, EndsWith(Lower(ThisItem.FileName), ".xlsx"), Icon.DocumentWithContent, Icon.Document)
                                          Width: =20
                                          X: =8
                                          Y: =16
                                    - btnMotFileName:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          Align: =Align.Left
                                          BorderThickness: =0
                                          Color: =RGBA(0, 94, 162, 1)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =32
                                          HoverFill: =RGBA(229, 241, 250, 1)
                                          OnSelect: |-
                                            =Notify("Demo: in production this opens the document from the library.", NotificationType.Information)
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Size: =11
